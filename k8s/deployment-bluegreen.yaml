apiVersion: apps/v1
kind: Deployment
metadata:
  name: erp-web-blue
  labels:
    app: erp-web
    slot: blue
spec:
  replicas: 3
  selector:
    matchLabels:
      app: erp-web
      slot: blue
  template:
    metadata:
      labels:
        app: erp-web
        slot: blue
    spec:
      containers:
        - name: erp-web
          image: ghcr.io/nathnael-engineer/erp-runtime:latest
          ports:
            - containerPort: 8069
          readinessProbe:
            httpGet:
              path: /web/health
              port: 8069
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1536Mi"
